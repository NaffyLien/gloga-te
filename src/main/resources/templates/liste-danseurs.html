<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des danseurs</title>
</head>
<body>
<h1>Liste des danseurs</h1>

<table border="1" cellpadding="8">
    <tr>
        <th>Nom</th>
        <th>Email</th>
        <th>Âge</th>
        <th>Actions</th>
    </tr>
    <tr th:each="e : ${danseurs}">
        <td th:text="${e.nom}"></td>
        <td th:text="${e.email}"></td>
        <td th:text="${e.age}"></td>
        <td>
            <a th:href="@{/danseurs/modifier/{id}(id=${e.id})}">Modifier</a>
            |
            <a th:href="@{/danseurs/supprimer/{id}(id=${e.id})}"
               onclick="return confirm('Supprimer ce danseur ?');">Supprimer</a>
        </td>
    </tr>
</table>

<br>
<a th:href="@{/danseurs/ajouter}">Ajouter un autre danseur</a>
</body>
</html>
